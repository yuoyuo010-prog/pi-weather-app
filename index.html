<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق Pi للطقس</title>
  <!-- استدعاء Pi SDK الرسمي -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #f59e0b; font-size: 24px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 15px; }
    button { padding: 12px 20px; border-radius: 10px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    .weather-info { background: #0f172a; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
    .temp { font-size: 42px; font-weight: bold; color: #f8fafc; margin: 10px 0; }
    .details { display: flex; justify-content: space-around; margin-top: 15px; color: #94a3b8; font-size: 13px; }
    .pi-btn { width: 100%; padding: 14px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .pi-btn:active { background: #7c3aed; }
    #status { margin-top: 15px; font-size: 13px; color: #10b981; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌤️ تطبيق Pi للطقس</h1>
    <p>تابع حالة الطقس واشترك في الخدمة المميزة عبر Pi Network</p>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="أدخل اسم المدينة (مثلاً: القدس)" value="القدس">
      <button onclick="getWeather()">بحث</button>
    </div>

    <div class="weather-info">
      <h2 id="cityName">القدس</h2>
      <div class="temp" id="tempValue">22°C</div>
      <p id="weatherDesc">مشمس بوجه عام</p>
      <div class="details">
        <span>الرطوبة: <strong id="humidity">45%</strong></span>
        <span>الرياح: <strong id="wind">12 كم/س</strong></span>
      </div>
    </div>

    <button class="pi-btn" onclick="payWithPi()">⚡ إجراء دفع تجريبي (0.1 Pi)</button>
    <div id="status"></div>
  </div>

  <script>
    // تهيئة Pi SDK
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    function getWeather() {
      const city = document.getElementById('cityInput').value || 'القدس';
      document.getElementById('cityName').innerText = city;
      // محاكاة جلب الطقس لتحديث الواجهة
      const randomTemp = Math.floor(Math.random() * 15) + 18;
      document.getElementById('tempValue').innerText = `${randomTemp}°C`;
    }

    // دالة الدفع التجريبي لاجتياز الخطوة الأخيرة في Pi Developer Portal
    function payWithPi() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "جاري فتح نافذة الدفع...";

      const paymentData = {
        amount: 0.1,
        memo: "اختبار الدفع لخدمة الطقس",
        metadata: { type: "weather_test_payment" }
      };

      const callbacks = {
        onReadyForServerApproval: function(paymentId) {
          statusDiv.innerText = "جاري توثيق المعاملة...";
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          statusDiv.innerText = "تم الدفع بنجاح! اكتمل الاختبار 🎉";
        },
        onCancel: function(paymentId) {
          statusDiv.innerText = "تم إلغاء عملية الدفع.";
        },
        onError: function(error, payment) {
          statusDiv.innerText = "حدث خطأ أثناء الدفع: " + error.message;
        }
      };

      Pi.createPayment(paymentData, callbacks);
    }
  </script>
</body>
</html>
